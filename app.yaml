runtime: nodejs18
env: standard

instance_class: F1

automatic_scaling:
  min_instances: 1
  max_instances: 5

env_variables:
  NODE_ENV: "production"
  PORT: "5000"

env_variables_beta:
  secretEnv: ["FIREBASE_PROJECT_ID", "FIREBASE_PRIVATE_KEY", "FIREBASE_CLIENT_EMAIL", "GEMINI_API_KEY"]

beta_settings:
  cloud_sql_instances: ""
